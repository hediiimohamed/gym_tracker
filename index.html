<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carnet — Suivi de musculation</title>
<meta name="description" content="Carnet d'entraînement Push/Pull/Legs : séries, charges, poids et mesures. Fonctionne hors-ligne, sans compte ni serveur.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0c10; }

  :root {
    --bg:#0a0c10; --surface:#13161c; --surface2:#191d26; --surface3:#222733; --border:#262c38;
    --text:#edeff3; --dim:#8a93a4; --faint:#586072;
    --accent:#4f7fff; --accent-ink:#071029; --accent-soft:rgba(79,127,255,.14);
    --gold:#f0b429; --danger:#f2555f; --danger-soft:rgba(242,85,95,.12); --violet:#a97bff;
    --good:#34c98a; --good-soft:rgba(52,201,138,.13); --gold-soft:rgba(240,180,41,.13);
    --mono: ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  body {
    color: var(--text); background: var(--bg); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; line-height: 1.45;
    max-width: 560px; margin: 0 auto;
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: var(--mono); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .card, .ex, .check, .hero, .quickcard, .stat, .sheet {
    box-shadow: 0 1px 2px rgba(0,0,0,.28), 0 4px 14px -6px rgba(0,0,0,.4);
  }

  /* ---- entête ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 11px;
    padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
    background: rgba(11,14,19,.9); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  header .mark {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
  }
  header .mark svg { width: 17px; height: 17px; color: var(--accent); }
  header .titles { min-width: 0; }
  header h1 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.02em; }
  header .meta {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); margin-top: 3px;
  }
  header .meta b { color: var(--accent); font-weight: 600; }

  #syncbar {
    position: sticky; top: calc(61px + env(safe-area-inset-top)); z-index: 19;
    margin: 10px 18px 0; padding: 9px 12px; border-radius: 10px;
    background: var(--gold-soft); border: 1px solid var(--gold); color: var(--gold);
    font-size: 12px; font-weight: 600; line-height: 1.4;
  }
  #syncbar[hidden] { display: none; }

  /* ---- navigation ---- */
  nav {
    display: flex; gap: 6px; padding: 12px 18px 0;
    overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 14px; border-radius: 10px;
    background: var(--surface); color: var(--dim); border: 1px solid transparent;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase;
    transition: .15s; white-space: nowrap;
  }
  nav button svg { width: 14px; height: 14px; flex: none; }
  nav button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; border-color: var(--accent); }
  nav button:focus-visible, main button:focus-visible, .sheet-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  main { padding: 18px; animation: rise .18s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

  /* ---- accueil ---- */
  .hero {
    background: linear-gradient(150deg, var(--surface3), var(--surface));
    border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 20px;
  }
  .hero-row { display: flex; justify-content: space-between; align-items: baseline; }
  .hero-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .hero-v { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--accent); }
  .hero-note { margin: 9px 0 0; font-size: 12.5px; color: var(--dim); line-height: 1.5; }

  .quickgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px; }
  .quickcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 0; transition: .15s;
  }
  .quickcard:active { border-color: var(--accent); background: var(--surface2); }
  .quickcard svg { width: 18px; height: 18px; color: var(--accent); }
  .qc-label { font-weight: 700; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qc-sub { font-family: var(--mono); font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .spark { width: 100%; height: 56px; display: block; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .spark circle { fill: var(--accent); }
  .spark-foot { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .spark-foot .hi { color: var(--accent); }

  .barchart { width: 100%; height: 64px; display: block; }
  .chart-legend { display: flex; gap: 14px; margin-top: 11px; font-family: var(--mono); font-size: 10px;
    color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .chart-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .ex-pick {
    width: 100%; padding: 13px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 14px; font-weight: 600; margin-bottom: 11px;
    font-family: var(--sans); appearance: none; outline: none;
  }
  .ex-pick:focus { border-color: var(--accent); }

  .chatlog { display: flex; flex-direction: column; gap: 10px; min-height: 160px; margin-bottom: 14px; }
  .chatmsg { max-width: 82%; padding: 11px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
  .chatmsg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-bottom-right-radius: 4px; }
  .chatmsg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .chatmsg.typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .chatmsg.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite ease-in-out; }
  .chatmsg.typing span:nth-child(2) { animation-delay: .2s; }
  .chatmsg.typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

  .camera-btn { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .camera-btn svg { width: 18px; height: 18px; color: var(--accent); }
  .meal-preview { width: 100%; max-height: 280px; object-fit: cover; border-radius: 10px; display: block; background: var(--surface2); }
  .meal-actions { display: flex; gap: 9px; margin-top: 12px; }
  .meal-actions .ghostbtn { flex: 1; margin-bottom: 0; }
  .go-full {
    flex: 1; background: var(--accent); color: var(--accent-ink); font-weight: 700;
    font-size: 13px; text-transform: uppercase; letter-spacing: .03em;
    padding: 13px; border-radius: 10px;
  }
  .go-full:disabled { opacity: .5; }
  .meal-body { display: flex; gap: 12px; margin-top: 2px; }
  .meal-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface2); }
  .meal-info { flex: 1; min-width: 0; }
  .meal-items { font-size: 13px; font-weight: 600; }
  .meal-macros { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 4px; }
  .meal-note { font-size: 11.5px; color: var(--faint); margin-top: 5px; font-style: italic; }
  .meal-form textarea {
    width: 100%; min-height: 84px; padding: 11px 12px; resize: vertical;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 15px; line-height: 1.45; outline: none;
  }
  .meal-form textarea:focus { border-color: var(--accent); }
  .meal-form .meal-preview { margin-top: 10px; max-height: 180px; }
  .mrows { margin-top: 10px; border-top: 1px solid var(--border); }
  .mrow {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px;
    padding: 7px 0; border-bottom: 1px solid var(--border); text-align: left; font-size: 12.5px;
  }
  .mrow .nm { flex: 1; min-width: 0; }
  .mrow .g { font-family: var(--mono); font-weight: 600; }
  .mrow .src { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; }
  .mrow .src.pese { color: var(--good); background: var(--good-soft); }
  .mrow .src.est { color: var(--gold); background: var(--gold-soft); }
  .mrow .kc { font-family: var(--mono); color: var(--dim); width: 64px; text-align: right; flex: none; }
  .mrow input { width: 80px; padding: 8px; background: var(--surface3); border: 1px solid var(--accent); border-radius: 8px; color: var(--text); font-size: 16px; }
  .mtot { font-family: var(--mono); font-size: 11.5px; margin-top: 9px; }
  .favs { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .fav { display: inline-flex; align-items: center; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; overflow: hidden; }
  .fav button { padding: 11px 13px; font-size: 12.5px; font-weight: 600; min-height: 44px; }
  .fav button + button { padding: 11px 12px; color: var(--faint); border-left: 1px solid var(--border); font-weight: 400; }
  .nbar { margin-bottom: 14px; }
  .nrow { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .nrow .k { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .nrow .track { height: 8px; border-radius: 99px; background: var(--surface3); overflow: hidden; }
  .nrow .fill { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .nrow .fill.done { background: var(--good); }
  .nrow .v { font-family: var(--mono); font-size: 11.5px; min-width: 96px; text-align: right; }
  .nrow .v b { color: var(--good); font-weight: 700; }
  .sheet input { width: 100%; padding: 12px; margin: 0 0 16px; background: var(--surface3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 16px; }

  /* ---- alerte reprise ---- */
  .phase {
    display: flex; gap: 11px; align-items: flex-start;
    background: var(--danger-soft); border-left: 3px solid var(--danger);
    border-radius: 0 12px 12px 0; padding: 12px 14px; margin-bottom: 18px;
    font-size: 12.5px; line-height: 1.5;
  }
  .phase b { color: #ff8a95; }

  /* ---- exercice ---- */
  .ex { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; margin-bottom: 11px; overflow: hidden; }
  .ex[data-prio="1"] { box-shadow: inset 3px 0 0 var(--accent); }
  .ex-head { padding: 14px 15px 11px; }
  .ex-name { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
  .ex-sub {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); margin-top: 4px;
  }
  .ex-sub em { color: var(--accent); font-style: normal; }
  .ex-note { font-size: 11.5px; color: var(--dim); margin-top: 7px; line-height: 1.45; }

  .sets { padding: 0 15px 4px; }
  .row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .row .n { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 18px; flex: none; }
  .fld { flex: 1; position: relative; }
  .fld input {
    width: 100%; padding: 11px 33px 11px 12px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 16px; font-weight: 600; outline: none; transition: .14s;
  }
  .fld input:focus { border-color: var(--accent); background: var(--surface3); }
  .fld input::placeholder { color: var(--faint); font-weight: 400; }
  .fld u {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    text-decoration: none; pointer-events: none;
  }
  .prev {
    font-family: var(--mono); font-size: 10.5px; color: var(--dim);
    width: 62px; min-height: 44px; flex: none; text-align: center; padding: 4px 2px;
    border-radius: 9px; border: 1px dashed var(--border); transition: .14s;
    -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .prev i { font-style: normal; font-weight: 700; margin-left: 2px; }
  .prev:not(:disabled):active { color: var(--accent-ink); background: var(--accent); }
  .prev:disabled { cursor: default; }

  .q {
    width: 44px; height: 44px; flex: none; border-radius: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--faint);
    transition: .14s;
  }
  .q[data-v="1"]   { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .q[data-v="0.5"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .q[data-v="0"]   { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .q.pulse { animation: qpulse .9s ease 2; }
  @keyframes qpulse { 0%,100% { transform: scale(1); } 40% { transform: scale(1.18); border-color: var(--accent); color: var(--accent); } }
  .row.core .fld { flex: 2; }
  .ex-name-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .st { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; color: var(--dim); }
  .st[data-st="hit"] { color: var(--good); } .st[data-st="over"] { color: var(--accent); } .st[data-st="under"] { color: var(--gold); }
  details.std { margin-top: 8px; font-size: 12px; }
  details.std summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 11.5px; min-height: 28px; display: flex; align-items: center; }
  details.std p { margin: 4px 0 0; padding: 8px 10px; border-left: 2px solid var(--accent); background: var(--surface2); border-radius: 0 8px 8px 0; line-height: 1.5; }
  .review .big { font-size: 15px; font-weight: 650; line-height: 1.45; }
  .askq { text-align: left; width: 100%; min-height: 44px; font-size: 12.5px; color: var(--text); line-height: 1.45; padding: 4px 0; }
  .askq span { display: inline-block; margin-left: 6px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .plan-list li { margin-bottom: 4px; }
  .plan-list li.done { color: var(--dim); } .plan-list li.done b { color: var(--text); font-weight: 600; }
  .plan-list.ask li.done::marker { content: "✓ "; color: var(--good); }
  .sum { margin-top: 10px; }
  .sum-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
  .bar { flex-wrap: wrap; }
  .bar-msg { flex: 1 0 100%; font-size: 11.5px; font-weight: 600; color: var(--gold); margin-bottom: 2px; }
  .bar-msg[hidden] { display: none; }
  .card h3 small { display: block; font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--dim); margin-top: 3px; }
  .qm { font-weight: 700; margin-left: 2px; }
  .qm[data-v="1"] { color: var(--good); } .qm[data-v="0.5"] { color: var(--gold); } .qm[data-v="0"] { color: var(--danger); }

  .ex-target {
    margin-top: 9px; padding: 7px 10px; border-radius: 8px; background: var(--accent-soft);
    font-size: 12px; line-height: 1.45; color: var(--text);
  }
  .ex-target b { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-right: 5px; }
  .ex-target span { display: block; color: var(--dim); font-size: 11.5px; margin-top: 3px; }

  .review { border-color: var(--accent); }
  .ex-target .why { font-style: italic; color: var(--faint); }
  .plan-list { margin: 9px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.5; color: var(--dim); }
  .plan-list.ask li::marker { content: "? "; color: var(--gold); font-weight: 700; }
  .review .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .review p { margin: 7px 0 0; font-size: 13px; line-height: 1.55; }
  .review .ghostbtn { margin: 12px 0 0; }
  .review-ex { margin-top: 10px; font-size: 12px; line-height: 1.5; color: var(--dim); }
  .review-ex strong { color: var(--text); font-weight: 600; }
  .review-ex em { font-style: normal; font-family: var(--mono); color: var(--accent); }

  .ex-video {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 9px;
    font-size: 11.5px; color: var(--accent); text-decoration: none; font-weight: 600;
  }
  .ex-video svg { width: 14px; height: 14px; flex: none; }

  .sub-row {
    display: flex; align-items: center; gap: 6px; margin-top: 10px;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 1px;
  }
  .sub-row::-webkit-scrollbar { display: none; }
  .sub-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint); flex: none;
  }
  .sub-chip {
    flex: none; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 11px; font-size: 11px; color: var(--dim); white-space: nowrap;
  }
  .add {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); padding: 3px 0 12px 27px;
  }
  .add:active { color: var(--accent); }

  /* ---- checklist dos ---- */
  .check { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 11px; }
  .check h3 { margin: 0 0 10px; font-size: 12px; font-family: var(--mono);
    letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
  .opts { display: flex; gap: 7px; }
  .opts button {
    flex: 1; padding: 11px 4px; border-radius: 9px; background: var(--surface2);
    border: 1px solid var(--border); font-size: 11.5px; color: var(--dim); line-height: 1.3;
  }
  .opts button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 650; border-color: var(--accent); }
  .opts button[aria-pressed="true"][data-v="2"] { background: var(--danger); color: #fff; border-color: var(--danger); }
  .check textarea {
    width: 100%; margin-top: 10px; padding: 11px 12px; resize: vertical; min-height: 46px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 15px; outline: none;
  }
  .check textarea:focus { border-color: var(--accent); }
  .check .warn { margin-top: 10px; font-size: 12px; color: #ff8a95; line-height: 1.5; }

  /* ---- barre basse (repos / enregistrer) ---- */
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    max-width: 560px; margin: 0 auto;
    background: rgba(20,25,34,.96); backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 11px 18px calc(11px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 9px;
  }
  .clock {
    font-family: var(--mono); font-size: 21px; font-weight: 600;
    min-width: 60px; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .clock[data-run="1"] { color: var(--accent); }
  .bar .pill { font-family: var(--mono); font-size: 11px; padding: 9px 12px; min-height: 44px;
    border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--dim); }

/* ---- accès : code d'appareil, stocké une fois en local ---- */
const TOKEN_KEY = "carnet.token";
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } };
const setToken = t => { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} };
const clearToken = () => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

/* ---- synchronisation : serveur versionné + copie locale + file d'attente ----
   Le serveur garde un numéro de version. Chaque envoi dit sur quelle version il
   se base ; si un autre appareil a écrit entre-temps (409), on fusionne et on
   renvoie. Tant qu'un envoi n'a pas réussi, la copie locale est marquée
   « en attente » et on réessaie (chargement, retour du réseau, toutes les 30 s). */
const PENDING_KEY = "carnet.pending";
const VERSION_KEY = "carnet.version";
const STATE_TIMEOUT = 20000;

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

const normalize = d => ({ ...(d || {}),
  sessions: (d && d.sessions) || [], weights: (d && d.weights) || [],
  measures: (d && d.measures) || [], deleted: (d && d.deleted) || [] });

// Union par date (ISO, unique). Sur un doublon, `mine` gagne, mais un bilan
// Claude présent d'un seul côté est gardé. Une date dans `deleted` ne revient jamais.
function mergeStates(theirs, mine) {
  theirs = normalize(theirs); mine = normalize(mine);
  const deleted = [...new Set([...theirs.deleted, ...mine.deleted])];
  const gone = new Set(deleted);
  const union = (a, b, pick = (old, cur) => cur) => {
    const m = new Map(a.map(x => [x.date, x]));
    b.forEach(x => m.set(x.date, pick(m.get(x.date), x)));
    return [...m.values()].filter(x => !gone.has(x.date))
      .sort((x, y) => new Date(x.date) - new Date(y.date));
  };
  return { ...theirs, ...mine,
    sessions: union(theirs.sessions, mine.sessions,
      (old, cur) => old && old.review && !cur.review ? { ...cur, review: old.review } : cur),
    weights:  union(theirs.weights, mine.weights),
    measures: union(theirs.measures, mine.measures),
    deleted };
}

async function fetchT(url, opts = {}, ms = STATE_TIMEOUT) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctl.signal }); }
  finally { clearTimeout(timer); }
}
const authHeaders = json => ({ Authorization: "Bearer " + getToken(), ...(json ? { "Content-Type": "application/json" } : {}) });

const sync = { busy: null, offline: false, rev: 0 };
const currentVersion = () => Number(lsGet(VERSION_KEY) || 0);
const setVersion = v => lsSet(VERSION_KEY, String(v));
const isPending = () => lsGet(PENDING_KEY) === "1";
function setPending(on) {
  if (on) lsSet(PENDING_KEY, "1"); else lsDel(PENDING_KEY);
  const el = $("#syncbar"); if (el) el.hidden = !on;
}
const saveLocal = () => lsSet(KEY, JSON.stringify(state));
function readLocal() { try { const v = lsGet(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

class Unauthorized extends Error {}
async function fetchServerState() {
  const r = await fetchT("/api/state", { headers: authHeaders() });
  if (r.status === 401) throw new Unauthorized();
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

// Envoie l'état courant. Vrai seulement si le serveur a confirmé la dernière version locale.
function pushState() {
  if (!sync.busy) sync.busy = (async () => {
    let conflicts = 0;
    try {
      for (let round = 0; round < 6; round++) {
        const rev = sync.rev;
        const r = await fetchT("/api/state", { method: "PUT", headers: authHeaders(true),
          body: JSON.stringify({ data: state, baseVersion: currentVersion() }) });
        if (r.status === 401) { clearToken(); renderUnlock(); return false; }
        if (r.status === 409) {
          if (++conflicts > 2) return false;
          const j = await r.json();
          state = mergeStates(j.data, state);
          setVersion(j.version); saveLocal(); sync.merged = true;
          continue;
        }
        if (!r.ok) return false;
        setVersion((await r.json()).version);
        sync.offline = false;
        if (rev === sync.rev) { setPending(false); return true; }
      }
      return false;
    } catch (e) { return false; }
    finally { sync.busy = null; }
  })();
  return sync.busy;
}

// Rendu sans casser une saisie en cours.
function softRender() {
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
  render();
}

async function syncTick() {
  if (!getToken() || sync.busy) return;
  if (isPending()) {
    const ok = await pushState();
    if (ok && sync.merged) { sync.merged = false; softRender(); }

async function load() {

  $("#view").innerHTML = `<div class="empty">Connexion au serveur…<br>(le serveur gratuit se réveille, ça peut prendre 30 s)</div>`;

function sparkline(values) {
  const n = values.length;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = n > 1 ? (i / (n - 1)) * 100 : 50;
    const y = 38 - ((v - min) / range) * 32;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const last = pts[pts.length - 1].split(",");
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none">
    <polyline points="${pts.join(" ")}"></polyline>
    <circle cx="${last[0]}" cy="${last[1]}" r="1.8"></circle>
  </svg>`;
}
function progressChart(values) {
  const n = values.length;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = n > 1 ? (i / (n - 1)) * 100 : 50;
    const y = 38 - ((v - min) / range) * 32;
    return [x, y];
  });
  const line = pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.6"></circle>`).join("");
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none">
    <polyline points="${line}"></polyline>${dots}
  </svg>`;
}
function barChart(items) {
  const max = Math.max(...items.map(i => i.v), 1);
  const n = items.length, gap = 1.2;
  const bw = (100 - gap * (n - 1)) / n;
  const bars = items.map((it, i) => {
    const x = i * (bw + gap);
    const bh = Math.max((it.v / max) * 58, 1);
    const y = 64 - bh;
    return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bw.toFixed(2)}" height="${bh.toFixed(2)}" rx="1.5" fill="${it.color}"></rect>`;
  }).join("");
  return `<svg class="barchart" viewBox="0 0 100 64" preserveAspectRatio="none">${bars}</svg>`;
}

// Reprise : rang de la séance (à la date `at`) depuis la dernière coupure ≥ CYCLE.breakDays.
function repriseInfo(at = new Date().toISOString()) {
  const seq = [...state.sessions.map(s => s.date).filter(d => d < at).sort(), at];
  const daysSinceLast = seq.length > 1 ? daysBetween(seq[seq.length - 2], at) : null;
  for (let i = seq.length - 1; i > 0 && seq.length - i <= 3; i--) {
    const gap = daysBetween(seq[i - 1], seq[i]);
    if (gap >= CYCLE.breakDays) return { daysSinceLast, reprise: { n: seq.length - i, gapDays: gap } };
  }
  return { daysSinceLast, reprise: null };
}
function seenLoads(ids) {

const realSets = sets => (sets || []).filter(x => x.reps > 0);
// Charge par défaut des tractions : dernier poids de corps noté, sinon la dernière charge utilisée.
function bodyweightFor(id) {
  const bw = latestBodyweight();
  if (bw) return bw;
  const last = lastSets(id);
  return last && last[0] ? last[0].kg : null;
}
// Objectif d'un exercice : le plan du jour, sinon ce qui a été fait la dernière fois.
function targetSets(key, id) {
  const pt = draft.plans[key] && draft.plans[key].exercises[id];
  if (pt && pt.sets.length) return { sets: pt.sets, fromPlan: true };
  const last = realSets(lastSets(id));
  return last.length ? { sets: last, fromPlan: false } : null;
}
// "over" | "hit" | "under" | null (rien à comparer)
function compareSets(done, target, core) {
  if (!target || !done.length) return null;
  let over = false;
  for (let i = 0; i < done.length; i++) {
    const t = target[i]; if (!t) continue;
    const d = done[i];
    if ((!core && d.kg < t.kg) || d.reps < t.reps) return "under";
    if ((!core && d.kg > t.kg) || d.reps > t.reps) over = true;
  }
  if (done.length < target.length) return "under";
  return over ? "over" : "hit";
}
const STATUS = { over: "▲ Dépassé", hit: "✓ Objectif atteint", under: "▼ En dessous" };
// Lignes affichées : ce qui est prévu (plan du jour, sinon programme), plus les séries ajoutées.
function rowCount(key, ex) {
  const t = targetSets(key, ex.id);
  return Math.max((draft.sets[ex.id] || []).length, t && t.fromPlan ? t.sets.length : ex.s);
}
// Série saisie → {kg, reps, q} numériques (gainage : kg 0 ; tractions : poids du corps par défaut)
function cleanSet(ex, d) {
  const reps = num(d.reps);
  if (!(reps > 0)) return null;
  const kg = ex.core ? 0 : num(d.kg) ?? (ex.bw ? bodyweightFor(ex.id) : null) ?? 0;
  return d.q != null ? { kg, reps, q: d.q } : { kg, reps };
}
function liveStatus(key, ex) {
  const n = rowCount(key, ex);
  const rows = Array.from({ length: n }, (_, i) => (draft.sets[ex.id] || [])[i] || {});
  const done = rows.map(d => cleanSet(ex, d));
  if (done.some(x => !x)) return "";
  const r = compareSets(done, targetSets(key, ex.id)?.sets, ex.core);
  return r ? `<span class="st" data-st="${r}">${STATUS[r]}</span>` : "";
}

  if (reprise && reprise.n < 3) {
    h += `<div class="phase"><div><b>Reprise — séance ${reprise.n} après ${reprise.gapDays} jours sans séance.</b>
      Charges à ~${reprise.n === 1 ? "80" : "90-95"} % de l'habituel, aucune série à l'échec.
      Douleur qui irradie dans la jambe, engourdissement ou perte de force : tu arrêtes la séance et tu consultes.</div></div>`;
  }

  const lastS = lastOfType(key);
  const plan = draft.plans[key];
  if (lastS && sameDay(lastS.date) && !dirty(key)) {
    h += sessionSummary(lastS) + reviewCard(lastS, false);
  }
  h += planCard(key, plan);
  if (lastS && !plan && !sameDay(lastS.date)) h += reviewCard(lastS, true);

  const order = plan && plan.order && plan.order.length ? plan.order : [];
  const rank = id => { const i = order.indexOf(id); return i < 0 ? order.length + day.ex.findIndex(e => e.id === id) : i; };
  [...day.ex].sort((a, b) => rank(a.id) - rank(b.id)).forEach(ex => { h += exCard(key, ex); });

  if (day.cardio) h += `<section class="ex"><div class="ex-head">
    <div class="ex-name">${esc(day.cardio)}</div><div class="ex-sub">Rappel</div></div></section>`;

  const lbl = ["Rien à signaler","Gêne légère","Douleur ou irradiation"];
  h += `<div class="check">
    <h3>État du dos</h3>
    <div class="opts">${lbl.map((l,i) =>
      `<button data-back="${i}" aria-pressed="${draft.back===i}" data-v="${i}">${l}</button>`).join("")}</div>
    ${draft.back===2 ? `<p class="warn">Tu arrêtes la séance maintenant. Prends rendez-vous chez le Hausarzt cette semaine pour l'ordonnance de Physiotherapie.</p>` : ""}
    <textarea id="note" placeholder="Note libre : énergie, sommeil, sensations…">${esc(draft.note)}</textarea>
  </div>`;

  // le volume par semaine passe en bas : secondaire pendant la séance
  const wv = weeklyVolumeByType(key);
  if (wv.length >= 2) {
    const cur = wv[wv.length - 1], prev = wv[wv.length - 2];
    const diff = cur.vol - prev.vol;
    const pct = prev.vol ? Math.round(diff / prev.vol * 100) : 0;
    h += `<div class="card">
      <div class="ex-sub" style="margin-bottom:9px">Volume ${day.label} par semaine</div>
      ${barChart(wv.slice(-6).map(w => ({ v: w.vol, color: SPLIT_COLOR[key] || "var(--accent)" })))}
      <div class="stat" style="margin-top:11px;margin-bottom:0"><span class="k">Vs semaine dernière</span><span class="v${diff >= 0 ? " hi" : ""}">${diff >= 0 ? "+" : ""}${Math.round(diff).toLocaleString("fr-FR")} kg<small>${diff >= 0 ? "+" : ""}${pct}%</small></span></div>
    </div>`;
  }

  h += bar(key);
  return h;
}

function planCard(key, plan) {
  const busy = planning === key;
  const btn = `<button class="ghostbtn" data-plan="${key}" ${planning ? "disabled" : ""}>${busy ? "Préparation…" : plan ? "Refaire le plan" : "Préparer la séance"}</button>`;
  if (!plan) return `<div class="card review"><div class="k">Plan du jour</div>
    <p>Claude fixe tes objectifs exacts, série par série, à partir de tes dernières séances.</p>${btn}</div>`;
  const answers = plan.answers || {};
  const qs = plan.missing.map((q, i) => answers[i] != null
    ? `<li class="done">${esc(q)}<br><b>→ ${esc(answers[i])}</b></li>`
    : askOpen === key + ":" + i
    ? `<li>${esc(q)}<div class="entry" style="margin:8px 0 0"><input id="askIn" placeholder="Ta réponse" aria-label="Réponse"><button data-answer="${key}:${i}">OK</button></div></li>`
    : `<li><button class="askq" data-ask="${key}:${i}">${esc(q)} <span>Répondre</span></button></li>`).join("");
  return `<div class="card review focus">
    <div class="k">Focus du jour${sameDay(plan.date) ? "" : " · plan du " + fmtD(plan.date)}</div>
    <p class="big">${esc(plan.focus)}</p>
    ${plan.missing.length ? `<ul class="plan-list ask">${qs}</ul>` : ""}
    ${plan.reminders.length ? `<ul class="plan-list">${plan.reminders.map(m => `<li>${esc(m)}</li>`).join("")}</ul>` : ""}
    ${btn}
  </div>`;
}

function reviewCard(s, compact) {
  const r = s.review;
  if (!r) {
    const busy = reviewing === s.date;
    return `<div class="card review">
      <div class="k">${compact ? "Dernière séance · " + fmtD(s.date) : "Coach"}</div>
      <p>${compact ? "Pas encore analysée. " : ""}Claude commente la séance et fixe tes objectifs pour la prochaine.</p>
      <button class="ghostbtn" data-review="${s.date}" ${busy || reviewing ? "disabled" : ""}>${busy ? "Analyse en cours…" : "Analyser avec Claude"}</button>
    </div>`;
  }
  const exLines = compact ? "" : Object.entries(r.exercises || {}).map(([id, x]) => {
    const e = exById(id);
    return `<div class="review-ex"><strong>${esc(e ? e.n : id)}</strong> — ${esc(x.comment)}<br><em>→ ${esc(x.target)}</em></div>`;
  }).join("");
  return `<div class="card review">
    <div class="k">Bilan du coach${compact ? " · " + fmtD(s.date) : ""}</div>
    <p>${esc(r.summary)}</p>
    ${exLines}
    ${compact ? "" : `<button class="ghostbtn" data-review="${s.date}" ${reviewing ? "disabled" : ""}>${reviewing === s.date ? "Analyse en cours…" : "Relancer l'analyse"}</button>`}
  </div>`;
}

function bar(key) {
  const m = String(Math.floor(timer.left/60)).padStart(2,"0");
  const s = String(timer.left%60).padStart(2,"0");
  const un = unratedCount(key);
  return `<div class="bar">
    <div class="bar-msg" id="unrated" ${un ? "" : "hidden"}>${un} série${un > 1 ? "s" : ""} non notée${un > 1 ? "s" : ""} — touche · pour noter la forme</div>
    <span class="clock" data-run="${timer.on?1:0}">${m}:${s}</span>
    <button class="pill" data-rest="60">60 s</button>
    <button class="pill" data-rest="90">90 s</button>
    <button class="go" data-save ${dirty(key)?"":"disabled"}>Enregistrer</button>
  </div>`;
}

function viewCoach() {
  const msgs = chat.messages;
  let log = msgs.length
    ? msgs.map(m => `<div class="chatmsg ${m.role}">${esc(m.content)}</div>`).join("")
    : `<div class="empty">${ICONS.coach}<br>Pose une question à ton coach : programme, progression, récupération, nutrition générale…</div>`;
  if (chat.loading) log += `<div class="chatmsg assistant typing"><span></span><span></span><span></span></div>`;
  return `<div class="chatlog">${log}</div>
    <div class="entry">
      <input id="chatIn" placeholder="Écris un message…" aria-label="Message au coach" ${chat.loading ? "disabled" : ""}>
      <button data-send-chat ${chat.loading ? "disabled" : ""}>Envoyer</button>
    </div>
    <p class="hint">Le coach voit tes dernières séances et ton poids, mais ce n'est pas un professionnel de santé — pour toute douleur ou blessure, consulte un médecin ou kinésithérapeute.</p>`;
}

// Totaux d'un jour (0 = aujourd'hui, -1 = hier) à partir des repas chargés.
function mealDayTotals(offset = 0) {
  const [a, b] = dayRange(offset);
  const day = meals.items.filter(m => m.date >= a && m.date < b);
  const sum = k => day.reduce((t, m) => t + (m[k] || 0), 0);
  return { count: day.length, kcal: sum("calories"), protein_g: sum("protein_g"), carbs_g: sum("carbs_g"), fat_g: sum("fat_g") };
}

// Barre du jour : kcal / protéines / glucides vs cibles. Protéines « assez » dès la cible.
function nutritionBar() {
  const t = mealDayTotals(0);
  const row = (label, v, goal, unit, enough) => {
    const pct = Math.min(100, Math.round(v / goal * 100));
    const done = v >= goal;
    return `<div class="nrow"><span class="k">${label}</span>
      <span class="track"><span class="fill${done ? " done" : ""}" style="width:${pct}%"></span></span>
      <span class="v">${done && enough ? `<b>✓ assez</b> · ${v} ${unit}` : `${v.toLocaleString("fr-FR")} / ${goal.toLocaleString("fr-FR")} ${unit}`}</span></div>`;
  };
  return `<div class="card nbar">
    <div class="ex-sub" style="margin:0 0 11px">Aujourd'hui · ${t.count} repas</div>
    ${row("Kcal", t.kcal, NUTRITION.kcal, "kcal")}
    ${row("Protéines", t.protein_g, NUTRITION.protein_g, "g", true)}
    ${row("Glucides", t.carbs_g, NUTRITION.carbs_g, "g")}
  </div>`;
}

function mealCard(m) {
  let body;
  if (m.rows && m.rows.length) {
    const rows = m.rows.map((r, i) => {
      const key = m.id + ":" + i;
      if (meals.editing === key) return `<div class="mrow"><span class="nm">${esc(r.name)}</span>
        <input id="gramsIn" inputmode="decimal" value="${r.grams}" aria-label="Grammes pour ${esc(r.name)}"><span class="g">g</span>
        <button class="sheet-btn primary" style="flex:none;padding:10px 14px" data-savegrams="${key}">OK</button></div>`;
      const pese = r.grams_source === "pesé";
      return `<button class="mrow" data-editrow="${key}" aria-label="Corriger les grammes de ${esc(r.name)}">
        <span class="nm">${esc(r.name)}</span><span class="g">${r.grams} g</span>
        <span class="src ${pese ? "pese" : "est"}">${pese ? "pesé" : "estimé"}</span>
        <span class="kc">${r.kcal} kcal</span></button>`;
    }).join("");
    body = `<div class="mrows">${rows}</div>
      <div class="mtot">Total ${m.calories} kcal · P ${m.protein_g} g · G ${m.carbs_g} g · L ${m.fat_g} g</div>
      ${m.missing && m.missing.length ? `<ul class="plan-list ask">${m.missing.map(q => `<li>${esc(q)}</li>`).join("")}</ul>` : ""}
      ${m.analysisNote ? `<div class="meal-note">${esc(m.analysisNote)}</div>` : ""}
      ${m.hasImage ? `<img class="meal-thumb" style="margin-top:10px" data-mealimg="${m.id}" alt="">` : ""}
      <button class="ghostbtn" style="margin:10px 0 0" data-favmeal="${m.id}">☆ Enregistrer en favori</button>`;
  } else {
    // repas enregistrés avant la v3 : photo + estimation globale
    body = `<div class="meal-body">
      ${m.hasImage ? `<img class="meal-thumb" data-mealimg="${m.id}" alt="">` : ""}
      <div class="meal-info">
        <div class="meal-items">${esc((m.items || []).join(", ") || "Repas")}</div>
        ${m.calories != null ? `<div class="meal-macros">${m.calories} kcal · P ${m.protein_g ?? "?"} · G ${m.carbs_g ?? "?"} · L ${m.fat_g ?? "?"}</div>` : `<div class="meal-macros">Estimation indisponible</div>`}
        ${m.analysisNote ? `<div class="meal-note">${esc(m.analysisNote)}</div>` : ""}
      </div>
    </div>`;
  }
  return `<article class="card meal-card">
    <div class="date-row">
      <div class="date">${fmtD(m.date)} · ${new Date(m.date).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</div>
      <button class="del" data-delmeal="${m.id}" aria-label="Supprimer ce repas">${ICONS.trash}</button>
    </div>
    ${m.description ? `<div class="said" style="margin-top:4px">${esc(m.description)}</div>` : ""}
    ${body}
  </article>`;
}

function viewMeals() {
  let h = nutritionBar();
  const busy = meals.uploading;
  h += `<div class="card meal-form">
    <textarea id="mealText" placeholder="Ce que tu as mangé, en grammes pesés — ex. riz basmati 100 g cru, poulet 150 g cru, sauce chili 1 c. à soupe" aria-label="Ce que tu as mangé, en grammes pesés" ${busy ? "disabled" : ""}>${esc(meals.text)}</textarea>
    ${meals.photoPreview ? `<img class="meal-preview" src="${meals.photoPreview}" alt="Photo du repas">` : ""}
    <div class="meal-actions">
      ${meals.photoPreview
        ? `<button class="ghostbtn" data-cancel-meal ${busy ? "disabled" : ""}>Retirer la photo</button>`
        : `<button class="ghostbtn camera-btn" data-take-photo ${busy ? "disabled" : ""}>${ICONS.camera}<span>Photo (optionnel)</span></button>`}
      <button class="go-full" data-analyze-meal ${busy ? "disabled" : ""}>${busy ? "Calcul…" : "Calculer"}</button>
    </div>
    <input type="file" id="mealFile" accept="image/*" capture="environment" hidden>
  </div>`;

  h += `<h2 class="sec">Favoris</h2>`;
  h += meals.favorites.length
    ? `<div class="favs">${meals.favorites.map(f => `<span class="fav">
        <button data-logfav="${f.id}" aria-label="Noter ${esc(f.name)}">+ ${esc(f.name)}</button>
        <button data-delfav="${f.id}" aria-label="Supprimer le favori ${esc(f.name)}">✕</button></span>`).join("")}</div>`
    : `<p class="hint">Note un repas pesé, puis « ☆ Enregistrer en favori » sur sa carte : tu pourras le noter en un tap (Shaker du matin, Collation 16h, Bol skyr du soir…).</p>`;

  h += `<h2 class="sec">Historique</h2>`;
  h += meals.items.length
    ? meals.items.map(mealCard).join("")
    : `<div class="empty">${ICONS.meals}<br>Écris ce que tu as mangé, en grammes pesés. La photo est optionnelle.</div>`;
  h += `<p class="hint" style="margin-top:14px">Les quantités pesées sont prises telles quelles. Les aliments sans poids sont estimés et signalés — corrige les grammes en touchant la ligne.</p>`;
  return h;
}

function viewJournal() {
  if (!state.sessions.length)
    return `<div class="empty">${ICONS.journal}<br>Aucune séance enregistrée.<br>Note tes charges dans Push, Pull ou Legs, puis appuie sur Enregistrer.</div>`;

  return [...state.sessions].reverse().map(s => {
    const all = Object.values(s.ex).flat().filter(x => x.reps > 0);
    const vol = all.reduce((a,x) => a + x.kg * x.reps, 0);
    const lines = Object.entries(s.ex).map(([id, sets]) => {
      const e = exById(id);
      return `<div><strong>${esc(e ? e.n : id)}</strong><br>${realSets(sets).map(x => (e && e.core ? x.reps + " reps" : x.kg + "×" + x.reps) + qMark(x.q)).join("  ")}</div>`;
    }).join("");
    return `<article class="card">
      <div class="date-row">
        <div class="date">${fmtD(s.date)} · ${PROGRAM[s.type] ? PROGRAM[s.type].label : s.type}</div>
        <button class="del" data-del="${s.date}" aria-label="Supprimer cette séance">${ICONS.trash}</button>
      </div>
      ${all.some(x => x.q != null)
        ? `<h3>${all.filter(x => x.q === 1).length}/${all.length} séries au standard<small>Volume ${Math.round(vol).toLocaleString("fr-FR")} kg</small></h3>`
        : `<h3>Volume ${Math.round(vol).toLocaleString("fr-FR")} kg</h3>`}
      <div class="body">${lines}</div>
      ${s.note ? `<div class="said">${esc(s.note)}</div>` : ""}
      ${s.back ? `<div class="dosflag">Dos · ${s.back===2 ? "douleur signalée" : "gêne légère"}</div>` : ""}
    </article>${PROGRAM[s.type] ? reviewCard(s, false) : ""}`;
  }).join("");
}

function viewSuivi() {
  let h = `<h2 class="sec">Poids à jeun</h2>
    <div class="entry">
      <input id="wIn" inputmode="decimal" placeholder="kg" aria-label="Poids à jeun">
      <button data-addw>Noter</button>
    </div>`;

  const w = state.weights;
  if (w.length) {
    if (w.length >= 2) {
      const recent = w.slice(-20);
      h += `<div class="card">${sparkline(recent.map(x => x.kg))}
        <div class="spark-foot"><span>${recent[0].kg.toFixed(1)} kg</span><span class="hi">${recent[recent.length-1].kg.toFixed(1)} kg</span></div>
      </div>`;
    }
    const cur = w[w.length-1].kg, a7 = avg(w,7), a28 = avg(w,28);
    h += `<div class="stat"><span class="k">Dernier</span><span class="v">${cur.toFixed(1)} kg</span></div>`;
    if (a7)  h += `<div class="stat"><span class="k">Moyenne 7 j</span><span class="v hi">${a7.toFixed(1)} kg</span></div>`;
    if (a28 && a7) {
      const d = a7 - a28;
      h += `<div class="stat"><span class="k">Tendance</span><span class="v">${d>=0?"+":""}${d.toFixed(2)} kg<small>vs 28 j</small></span></div>`;
    }
    h += `<div class="stat"><span class="k">Cible cycle</span><span class="v">${CYCLE.weightGoal.toFixed(1)} kg</span></div>`;
  } else {
    h += `<p class="hint">Chaque matin, à jeun, après être passé aux toilettes, avant de boire. C'est la moyenne sur 7 jours qu'on lit, jamais le chiffre du jour.</p>`;
  }

  h += `<h2 class="sec">Volume d'entraînement</h2>`;
  const vols = sessionVolumes();
  if (vols.length) {
    const recentVols = vols.slice(-15);
    h += `<div class="card">${barChart(recentVols.map(v => ({ v: v.vol, color: SPLIT_COLOR[v.type] || "var(--dim)" })))}
      <div class="chart-legend">
        <span><i style="background:var(--accent)"></i>Push</span>
        <span><i style="background:var(--gold)"></i>Pull</span>
        <span><i style="background:var(--violet)"></i>Legs</span>
      </div>
    </div>`;
    const totalVol = vols.reduce((a, v) => a + v.vol, 0);
    h += `<div class="stat"><span class="k">Volume moyen / séance</span><span class="v">${Math.round(totalVol / vols.length).toLocaleString("fr-FR")} kg</span></div>`;
    h += `<div class="stat"><span class="k">Volume total soulevé</span><span class="v hi">${Math.round(totalVol).toLocaleString("fr-FR")} kg</span></div>`;
  } else {
    h += `<p class="hint">Le volume (charge × répétitions cumulées par séance) apparaîtra ici dès ta première séance enregistrée.</p>`;
  }

  h += `<h2 class="sec">Progression par exercice</h2>`;
  const exWithData = allEx().filter(e => exerciseSeries(e.id).length >= 1);
  if (exWithData.length) {
    if (!analyticsEx || !exWithData.some(e => e.id === analyticsEx)) analyticsEx = exWithData[0].id;
    h += `<select id="exPick" class="ex-pick" aria-label="Choisir un exercice">` +
      exWithData.map(e => `<option value="${e.id}" ${e.id === analyticsEx ? "selected" : ""}>${esc(e.n)}</option>`).join("") +
      `</select>`;
    const series = exerciseSeries(analyticsEx);
    if (series.length >= 2) {
      h += `<div class="card">${progressChart(series.map(s => s.kg))}
        <div class="spark-foot"><span>${series[0].kg} kg</span><span class="hi">${series[series.length-1].kg} kg</span></div>
      </div>`;
      const delta = series[series.length - 1].kg - series[0].kg;
      h += `<div class="stat"><span class="k">Évolution</span><span class="v${delta >= 0 ? " hi" : ""}">${delta >= 0 ? "+" : ""}${delta.toFixed(1)} kg<small>depuis la 1<sup>re</sup> séance</small></span></div>`;
    } else {
      h += `<p class="hint">Une seule séance avec cet exercice pour l'instant — reviens après la prochaine pour voir la tendance.</p>`;
    }
  } else {
    h += `<p class="hint">Enregistre au moins une séance pour voir la progression par exercice ici.</p>`;
  }

  h += `<h2 class="sec">Mesures — le dimanche</h2>`;
  h += `<div class="entry" style="flex-wrap:wrap">` +
    MEASURES.map(m => `<input inputmode="decimal" data-m="${m.id}" placeholder="${m.n}" aria-label="${m.n} en cm" style="flex:1 1 44%">`).join("") +
    `<button data-addm style="flex:1 1 100%;padding:13px 0">Enregistrer les mesures</button></div>`;

  const ms = state.measures;
  if (ms.length) {
    const last = ms[ms.length-1], first = ms[0];
    if (last.epaules && last.taille) {
      const r = last.epaules / last.taille;
      const r0 = first.epaules && first.taille ? first.epaules / first.taille : null;
      h += `<div class="stat"><span class="k">Ratio épaules / taille</span>
        <span class="v hi">${r.toFixed(3)}${r0 && ms.length>1 ? `<small>départ ${r0.toFixed(3)}</small>` : ""}</span></div>`;
    }
    h += MEASURES.map(m => {
      if (last[m.id] == null) return "";
      const d = first[m.id] != null && ms.length > 1 ? last[m.id] - first[m.id] : null;
      return `<div class="stat"><span class="k">${m.n}</span><span class="v">${last[m.id]} cm${
        d !== null ? `<small>${d>=0?"+":""}${d.toFixed(1)}</small>` : ""}</span></div>`;
    }).join("");
  } else {
    h += `<p class="hint">Le ratio épaules / taille est la vraie mesure de ce cycle. Le poids monte partout ; la largeur, non. Mêmes conditions chaque dimanche, à la salle, après le premier repas.</p>`;
  }
  return h;
}

function viewData() {
  const n = state.sessions.length, w = state.weights.length, m = state.measures.length;
  return `<h2 class="sec">Sauvegarde</h2>
    <p class="hint">Tes données vivent dans le navigateur de ton téléphone. Vider les données de Safari les effacerait. Exporte une fois par mois — le fichier se range dans Fichiers ou iCloud, et se réimporte ici en cas de pépin ou sur un autre appareil.</p>
    <button class="ghostbtn" data-export>Exporter — ${n} séance${n>1?"s":""}, ${w} pesée${w>1?"s":""}, ${m} mesure${m>1?"s":""}</button>
    <button class="ghostbtn" data-import>Importer un fichier</button>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
    <h2 class="sec">Cycle en cours</h2>
    <div class="stat"><span class="k">Début</span><span class="v">${fmtD(CYCLE.start)}</span></div>
    <div class="stat"><span class="k">Semaine</span><span class="v hi">${week()}</span></div>
    <div class="stat"><span class="k">Séances totales</span><span class="v">${n}</span></div>
    <h2 class="sec">Zone sensible</h2>
    <button class="ghostbtn danger" data-clearall>Effacer toutes les données</button>
    <p class="hint" style="margin-top:22px">Pour modifier le programme, ouvre le fichier <code>index.html</code> et édite le bloc CONFIG tout en haut du script. Rien d'autre à toucher.</p>`;
}

function render() {
  saveDraft();
  $("#wk").textContent = "Semaine " + week();
  $("#goalw").textContent = CYCLE.weightGoal.toFixed(1) + " kg";
  nav();
  $("#view").innerHTML =
    tab === "home"    ? viewHome()    :
    tab === "coach"   ? viewCoach()   :
    tab === "meals"   ? viewMeals()   :
    tab === "journal" ? viewJournal() :
    tab === "suivi"   ? viewSuivi()   :

function resizeImageFile(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve({ dataUrl, base64: dataUrl.split(",")[1] });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function postMeal(body) {
  const r = await fetchT("/api/meals", { method: "POST", headers: authHeaders(true), body: JSON.stringify(body) }, 120000);
  if (r.status === 401) { clearToken(); renderUnlock(); return null; }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  meals.items.unshift({
    id: j.id, hasImage: Boolean(body.image), description: body.text || null,
    items: j.rows.map(x => x.name), rows: j.rows, missing: j.missing, analysisNote: j.note,
    calories: j.totals.kcal, protein_g: j.totals.protein_g, carbs_g: j.totals.carbs_g, fat_g: j.totals.fat_g,
    date: new Date().toISOString()

// Corriger les grammes d'une ligne : on recalcule depuis les valeurs pour 100 g.
async function saveGrams(key) {
  const [id, idx] = key.split(":");
  const m = meals.items.find(x => String(x.id) === id);
  const g = num($("#gramsIn").value);
  meals.editing = null;
  if (!m || g === null || g <= 0) { render(); return; }
  const r = m.rows[+idx];
  const p = r.per100 || {};
  Object.assign(r, { grams: Math.round(g), grams_source: "pesé" },
    ...["kcal", "protein_g", "carbs_g", "fat_g"].map(k => ({ [k]: Math.round((p[k] || 0) * g / 100) })));
  const sum = k => m.rows.reduce((t, x) => t + x[k], 0);
  Object.assign(m, { calories: sum("kcal"), protein_g: sum("protein_g"), carbs_g: sum("carbs_g"), fat_g: sum("fat_g") });
  // la quantité est maintenant pesée : la question sur cet aliment n'a plus lieu d'être
  const word = r.name.split(/\s+/)[0].toLowerCase();
  m.missing = (m.missing || []).filter(q => !q.toLowerCase().includes(word));
  render();
  try {
    const res = await fetchT("/api/meals/" + id, { method: "PATCH", headers: authHeaders(true), body: JSON.stringify({ rows: m.rows, missing: m.missing }) });
    toast(res.ok ? "Grammes corrigés" : "Correction non enregistrée");
  } catch (e) { toast("Correction non enregistrée"); }
}

const imgObserver = "IntersectionObserver" in window ? new IntersectionObserver(entries => {

    const img = en.target; imgObserver.unobserve(img);

        mealImgCache.set(id, URL.createObjectURL(await r.blob()));

      img.src = mealImgCache.get(id);
    } catch (e) {}
  });
}, { rootMargin: "200px" }) : null;

function startTimer(sec) {
  clearInterval(timer.iv);
  timer.left = sec; timer.on = true;
  const paint = () => {
    const c = document.querySelector(".clock"); if (!c) return;
    c.textContent = String(Math.floor(timer.left/60)).padStart(2,"0") + ":" + String(timer.left%60).padStart(2,"0");
    c.dataset.run = timer.on ? 1 : 0;
  };
  paint();
  timer.iv = setInterval(() => {
    timer.left--;
    if (timer.left <= 0) {
      clearInterval(timer.iv); timer.on = false; timer.left = 0; toast("Série suivante");
      if (navigator.vibrate) navigator.vibrate([250, 120, 250]);
    }
    paint();
  }, 1000);
}

async function saveSession() {
  // une seule séance par jour et par type : réenregistrer remplace celle du jour
  const today = new Date().toDateString();
  const dupIdx = state.sessions.findIndex(s => s.type === tab && new Date(s.date).toDateString() === today);
  const dup = state.sessions[dupIdx];
  const ids = PROGRAM[tab].ex.map(e => e.id);
  const ex = {}; let pr = 0;
  Object.entries(draft.sets).filter(([id]) => ids.includes(id)).forEach(([id, sets]) => {
    const e = exById(id);
    const clean = sets.map(s => s && cleanSet(e, s)).filter(Boolean);
    if (!clean.length) return;
    const best = bestVol(id, dup);
    if (best > 0) clean.forEach(s => { if (s.kg * s.reps > best) pr++; });
    ex[id] = clean;
  });
  if (!Object.keys(ex).length) { toast("Rien à enregistrer"); return; }

  const session = {
    date: new Date().toISOString(), type: tab, ex,
    back: draft.back, note: draft.note.trim()
  };
  if (draft.plans[tab]) session.plan = draft.plans[tab];
  if (dup) { state.sessions[dupIdx] = session; state.deleted.push(dup.date); }
  else state.sessions.push(session);
  const ok = await persist();
  ids.forEach(id => delete draft.sets[id]);
  delete draft.plans[tab];
  draft.back = 0; draft.note = "";
  saveDraft();
  const msg = dup ? "Séance enregistrée · remplace celle d'aujourd'hui" : "Séance enregistrée";
  toast(!ok ? PENDING_MSG : pr ? `${msg} · ${pr} record${pr>1?"s":""}` : msg);
  render();
}

async function reviewLastSession(dateStr) {
  const s = state.sessions.find(x => x.date === dateStr);
  if (!s || !PROGRAM[s.type] || reviewing) return;
  const history = state.sessions.filter(x => x.type === s.type && x.date < s.date).slice(-3).map(sessionForClaude);
  const { daysSinceLast, reprise } = repriseInfo(s.date);
  reviewing = s.date;
  render();
  try {
    const r = await fetch("/api/review", {
      method: "POST",
      headers: { Authorization: "Bearer " + getToken(), "Content-Type": "application/json" },
      body: JSON.stringify({
        session: { date: s.date, type: s.type, ex: s.ex, back: s.back, note: s.note },
        history, program: PROGRAM[s.type], daysSinceLast, reprise,
        seenLoads: seenLoads(PROGRAM[s.type].ex.map(e => e.id))
      })
    });
    if (r.status === 401) { clearToken(); reviewing = null; renderUnlock(); return; }
    const j = await r.json();
    if (r.ok) {
      s.review = { summary: j.summary, exercises: j.exercises, date: new Date().toISOString() };
      synced(await persist(), "Bilan prêt");
    } else {
      toast("Analyse impossible");
    }
  } catch (e) {
    toast("Connexion impossible");
  }
  reviewing = null;
  render();
}

async function requestPlan(key) {
  if (planning) return;
  const program = PROGRAM[key];
  const { daysSinceLast, reprise } = repriseInfo();
  planning = key;
  render();
  try {
    const r = await fetch("/api/plan", {
      method: "POST",
      headers: authHeaders(true),
      body: JSON.stringify({
        program, daysSinceLast, reprise,
        history: state.sessions.filter(s => s.type === key).slice(-3).map(sessionForClaude),
        seenLoads: seenLoads(program.ex.map(e => e.id)),
        today: dayRange(0), bodyweight: latestBodyweight()
      })
    });
    if (r.status === 401) { clearToken(); planning = null; renderUnlock(); return; }
    const j = await r.json();
    if (r.ok) { draft.plans[key] = j; toast("Plan prêt"); }
    else toast("Plan impossible");
  } catch (e) {
    toast("Connexion impossible");
  }
  planning = null;
  render();
}


document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "tokenIn") $("[data-unlock]")?.click();
  if (e.key === "Enter" && e.target.id === "chatIn") $("[data-send-chat]")?.click();
  if (e.key === "Enter" && e.target.id === "gramsIn") $("[data-savegrams]")?.click();
  if (e.key === "Enter" && e.target.id === "askIn") $("[data-answer]")?.click();
});

if (getToken()) boot(); else renderUnlock();
</script>
