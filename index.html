<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carnet — Suivi de musculation</title>
<meta name="description" content="Carnet d'entraînement Push/Pull/Legs : séries, charges, poids et mesures. Fonctionne hors-ligne, sans compte ni serveur.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#0a0c10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0c10; }

  :root {
    --bg:#0a0c10; --surface:#13161c; --surface2:#191d26; --surface3:#222733; --border:#262c38;
    --text:#edeff3; --dim:#8a93a4; --faint:#586072;
    --accent:#4f7fff; --accent-ink:#071029; --accent-soft:rgba(79,127,255,.14);
    --gold:#f0b429; --danger:#f2555f; --danger-soft:rgba(242,85,95,.12); --violet:#a97bff;
    --good:#34c98a; --good-soft:rgba(52,201,138,.13); --gold-soft:rgba(240,180,41,.13);
    --mono: ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  body {
    color: var(--text); background: var(--bg); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; line-height: 1.45;
    max-width: 560px; margin: 0 auto;
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: var(--mono); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .card, .ex, .check, .hero, .quickcard, .stat, .sheet {
    box-shadow: 0 1px 2px rgba(0,0,0,.28), 0 4px 14px -6px rgba(0,0,0,.4);
  }

  /* ---- entête ---- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 11px;
    padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
    background: rgba(11,14,19,.9); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  header .mark {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
  }
  header .mark svg { width: 17px; height: 17px; color: var(--accent); }
  header .titles { min-width: 0; }
  header h1 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: -.02em; }
  header .meta {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); margin-top: 3px;
  }
  header .meta b { color: var(--accent); font-weight: 600; }

  /* ---- navigation ---- */
  nav {
    display: flex; gap: 6px; padding: 12px 18px 0;
    overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 14px; border-radius: 10px;
    background: var(--surface); color: var(--dim); border: 1px solid transparent;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .08em; text-transform: uppercase;
    transition: .15s; white-space: nowrap;
  }
  nav button svg { width: 14px; height: 14px; flex: none; }
  nav button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; border-color: var(--accent); }
  nav button:focus-visible, main button:focus-visible, .sheet-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  main { padding: 18px; animation: rise .18s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

  /* ---- accueil ---- */
  .hero {
    background: linear-gradient(150deg, var(--surface3), var(--surface));
    border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 20px;
  }
  .hero-row { display: flex; justify-content: space-between; align-items: baseline; }
  .hero-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .hero-v { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--accent); }
  .hero-note { margin: 9px 0 0; font-size: 12.5px; color: var(--dim); line-height: 1.5; }

  .quickgrid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 18px; }
  .quickcard {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 0; transition: .15s;
  }
  .quickcard:active { border-color: var(--accent); background: var(--surface2); }
  .quickcard svg { width: 18px; height: 18px; color: var(--accent); }
  .qc-label { font-weight: 700; font-size: 13px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qc-sub { font-family: var(--mono); font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .spark { width: 100%; height: 56px; display: block; }
  .spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .spark circle { fill: var(--accent); }
  .spark-foot { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .spark-foot .hi { color: var(--accent); }

  .barchart { width: 100%; height: 64px; display: block; }
  .chart-legend { display: flex; gap: 14px; margin-top: 11px; font-family: var(--mono); font-size: 10px;
    color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .chart-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .ex-pick {
    width: 100%; padding: 13px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 14px; font-weight: 600; margin-bottom: 11px;
    font-family: var(--sans); appearance: none; outline: none;
  }
  .ex-pick:focus { border-color: var(--accent); }

  .chatlog { display: flex; flex-direction: column; gap: 10px; min-height: 160px; margin-bottom: 14px; }
  .chatmsg { max-width: 82%; padding: 11px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
  .chatmsg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-bottom-right-radius: 4px; }
  .chatmsg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .chatmsg.typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .chatmsg.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite ease-in-out; }
  .chatmsg.typing span:nth-child(2) { animation-delay: .2s; }
  .chatmsg.typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

  .camera-btn { display: flex; align-items: center; justify-content: center; gap: 9px; }
  .camera-btn svg { width: 18px; height: 18px; color: var(--accent); }
  .meal-preview { width: 100%; max-height: 280px; object-fit: cover; border-radius: 10px; display: block; background: var(--surface2); }
  .meal-actions { display: flex; gap: 9px; margin-top: 12px; }
  .meal-actions .ghostbtn { flex: 1; margin-bottom: 0; }
  .go-full {
    flex: 1; background: var(--accent); color: var(--accent-ink); font-weight: 700;
    font-size: 13px; text-transform: uppercase; letter-spacing: .03em;
    padding: 13px; border-radius: 10px;
  }
  .go-full:disabled { opacity: .5; }
  .meal-body { display: flex; gap: 12px; margin-top: 2px; }
  .meal-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface2); }
  .meal-info { flex: 1; min-width: 0; }
  .meal-items { font-size: 13px; font-weight: 600; }
  .meal-macros { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-top: 4px; }
  .meal-note { font-size: 11.5px; color: var(--faint); margin-top: 5px; font-style: italic; }

  /* ---- alerte reprise ---- */
  .phase {
    display: flex; gap: 11px; align-items: flex-start;
    background: var(--danger-soft); border-left: 3px solid var(--danger);
    border-radius: 0 12px 12px 0; padding: 12px 14px; margin-bottom: 18px;
    font-size: 12.5px; line-height: 1.5;
  }
  .phase b { color: #ff8a95; }

  /* ---- exercice ---- */
  .ex { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; margin-bottom: 11px; overflow: hidden; }
  .ex[data-prio="1"] { box-shadow: inset 3px 0 0 var(--accent); }
  .ex-head { padding: 14px 15px 11px; }
  .ex-name { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
  .ex-sub {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); margin-top: 4px;
  }
  .ex-sub em { color: var(--accent); font-style: normal; }
  .ex-note { font-size: 11.5px; color: var(--dim); margin-top: 7px; line-height: 1.45; }

  .sets { padding: 0 15px 4px; }
  .row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .row .n { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 18px; flex: none; }
  .fld { flex: 1; position: relative; }
  .fld input {
    width: 100%; padding: 11px 33px 11px 12px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 16px; font-weight: 600; outline: none; transition: .14s;
  }
  .fld input:focus { border-color: var(--accent); background: var(--surface3); }
  .fld input::placeholder { color: var(--faint); font-weight: 400; }
  .fld u {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    text-decoration: none; pointer-events: none;
  }
  .prev {
    font-family: var(--mono); font-size: 10px; color: var(--faint);
    width: 58px; flex: none; text-align: right; padding: 4px 0;
    border-radius: 6px; transition: .14s;
  }
  .prev:not(:disabled):active { color: var(--accent-ink); background: var(--accent); }
  .prev:disabled { cursor: default; }

  .q {
    width: 34px; height: 34px; flex: none; border-radius: 9px;
    background: var(--surface2); border: 1px solid var(--border);
    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--faint);
    transition: .14s;
  }
  .q[data-v="1"]   { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .q[data-v="0.5"] { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .q[data-v="0"]   { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .qm { font-weight: 700; margin-left: 2px; }
  .qm[data-v="1"] { color: var(--good); } .qm[data-v="0.5"] { color: var(--gold); } .qm[data-v="0"] { color: var(--danger); }

  .ex-target {
    margin-top: 9px; padding: 7px 10px; border-radius: 8px; background: var(--accent-soft);
    font-size: 12px; line-height: 1.45; color: var(--text);
  }
  .ex-target b { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-right: 5px; }
  .ex-target span { display: block; color: var(--dim); font-size: 11.5px; margin-top: 3px; }

  .review { border-color: var(--accent); }
  .review .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .review p { margin: 7px 0 0; font-size: 13px; line-height: 1.55; }
  .review .ghostbtn { margin: 12px 0 0; }
  .review-ex { margin-top: 10px; font-size: 12px; line-height: 1.5; color: var(--dim); }
  .review-ex strong { color: var(--text); font-weight: 600; }
  .review-ex em { font-style: normal; font-family: var(--mono); color: var(--accent); }

  .ex-video {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 9px;
    font-size: 11.5px; color: var(--accent); text-decoration: none; font-weight: 600;
  }
  .ex-video svg { width: 14px; height: 14px; flex: none; }

  .sub-row {
    display: flex; align-items: center; gap: 6px; margin-top: 10px;
    overflow-x: auto; scrollbar-width: none; padding-bottom: 1px;
  }
  .sub-row::-webkit-scrollbar { display: none; }
  .sub-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--faint); flex: none;
  }
  .sub-chip {
    flex: none; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 11px; font-size: 11px; color: var(--dim); white-space: nowrap;
  }
  .add {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); padding: 3px 0 12px 27px;
  }
  .add:active { color: var(--accent); }

  /* ---- checklist dos ---- */
  .check { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 11px; }
  .check h3 { margin: 0 0 10px; font-size: 12px; font-family: var(--mono);
    letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
  .opts { display: flex; gap: 7px; }
  .opts button {
    flex: 1; padding: 11px 4px; border-radius: 9px; background: var(--surface2);
    border: 1px solid var(--border); font-size: 11.5px; color: var(--dim); line-height: 1.3;
  }
  .opts button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 650; border-color: var(--accent); }
  .opts button[aria-pressed="true"][data-v="2"] { background: var(--danger); color: #fff; border-color: var(--danger); }
  .check textarea {
    width: 100%; margin-top: 10px; padding: 11px 12px; resize: vertical; min-height: 46px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 15px; outline: none;
  }
  .check textarea:focus { border-color: var(--accent); }
  .check .warn { margin-top: 10px; font-size: 12px; color: #ff8a95; line-height: 1.5; }

  /* ---- barre basse (repos / enregistrer) ---- */
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    max-width: 560px; margin: 0 auto;
    background: rgba(20,25,34,.96); backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 11px 18px calc(11px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 9px;
  }
  .clock {
    font-family: var(--mono); font-size: 21px; font-weight: 600;
    min-width: 60px; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .clock[data-run="1"] { color: var(--accent); }
  .bar .pill { font-family: var(--mono); font-size: 11px; padding: 9px 12px;
    border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--dim); }
  .bar .pill:active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .bar .go {
    margin-left: auto; background: var(--accent); color: var(--accent-ink);
    font-size: 12.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 11px 16px; border-radius: 9px;
  }
  .bar .go:disabled { opacity: .32; }

  /* ---- cartes génériques ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 11px; }
  .card .date-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card .date { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); }
  .card .del { flex: none; color: var(--faint); padding: 2px 4px; }
  .card .del:active { color: var(--danger); }
  .card .del svg { width: 15px; height: 15px; }
  .card h3 { margin: 3px 0 0; font-size: 13.5px; font-weight: 650; }
  .card .body { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 10px; line-height: 1.75; }
  .card .body strong { color: var(--text); font-weight: 500; }
  .card .said { font-size: 12px; color: var(--dim); margin-top: 9px; font-style: italic; }
  .card .dosflag { color: var(--danger); font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .1em; text-transform: uppercase; margin-top: 8px; }

  .stat { display: flex; justify-content: space-between; align-items: baseline;
    padding: 13px 15px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 9px; }
  .stat .k { font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); }
  .stat .v { font-family: var(--mono); font-size: 17px; font-weight: 600; }
  .stat .v.hi { color: var(--accent); }
  .stat .v small { font-size: 11px; color: var(--dim); font-weight: 400; margin-left: 5px; }

  .entry { display: flex; gap: 9px; margin-bottom: 9px; }
  .entry input {
    flex: 1; padding: 13px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 16px; font-weight: 600; outline: none; min-width: 0;
  }
  .entry input:focus { border-color: var(--accent); }
  .entry button {
    background: var(--accent); color: var(--accent-ink); font-weight: 700;
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 0 18px; border-radius: 10px; flex: none;
  }

  h2.sec {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim); font-weight: 500;
    margin: 26px 0 11px;
  }
  h2.sec:first-child { margin-top: 0; }

  .ghostbtn {
    width: 100%; padding: 13px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text);
    font-size: 13px; font-weight: 600; margin-bottom: 9px;
  }
  .ghostbtn:active { border-color: var(--accent); }
  .ghostbtn.danger { color: #ff8a95; }
  .ghostbtn.danger:active { border-color: var(--danger); }
  .hint { font-size: 11.5px; color: var(--dim); line-height: 1.55; margin: 0 0 18px; }

  .empty { text-align: center; padding: 44px 20px; color: var(--dim); font-size: 12.5px; line-height: 1.65; }
  .empty svg { width: 34px; height: 34px; color: var(--faint); margin-bottom: 12px; }

  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    background: var(--gold); color: #1a1400; font-size: 12.5px; font-weight: 700;
    padding: 10px 18px; border-radius: 999px; z-index: 50; white-space: nowrap;
    animation: pop .22s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%,8px); } }

  /* ---- boîtes de confirmation ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(4,6,10,.66); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px;
    animation: fade .15s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .sheet { background: var(--surface2); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; max-width: 340px; width: 100%; animation: rise .18s ease; }
  .sheet h3 { margin: 0 0 8px; font-size: 15px; }
  .sheet p { margin: 0 0 18px; font-size: 13px; color: var(--dim); line-height: 1.5; }
  .sheet-actions { display: flex; gap: 8px; }
  .sheet-btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 650; }
  .sheet-btn.ghost { background: var(--surface3); color: var(--text); }
  .sheet-btn.primary { background: var(--accent); color: var(--accent-ink); }
  .sheet-btn.danger { background: var(--danger); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="mark"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="4" height="4" rx="1"/><rect x="2.5" y="7" width="2.4" height="6" rx="1"/><rect x="15.1" y="7" width="2.4" height="6" rx="1"/></svg></div>
  <div class="titles">
    <h1>Carnet d'entraînement</h1>
    <div class="meta">PPL · <b id="wk"></b> · Cible <span id="goalw"></span></div>
  </div>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG — tout ce que tu peux modifier est dans ce bloc.
   Ajouter un exercice : copie une ligne, change id / n / s / r.
   L'id doit être unique et ne doit jamais changer une fois utilisé,
   sinon l'historique de cet exercice ne suivra plus.

/* ---- accès : code d'appareil, stocké une fois en local ---- */
const TOKEN_KEY = "carnet.token";
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } };
const setToken = t => { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} };
const clearToken = () => { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} };

/* ---- stockage : serveur (Turso) en priorité, repli local si hors-ligne ---- */
const store = {
  async get() {
    const t = getToken();
    if (t) {
      try {
        const r = await fetch("/api/state", { headers: { Authorization: "Bearer " + t } });
        if (r.status === 401) { clearToken(); renderUnlock(); return null; }
        if (r.ok) return JSON.stringify(await r.json());
      } catch (e) {}
    }
    try { const v = localStorage.getItem(KEY); if (v !== null) return v; } catch (e) {}
    try { const r = await window.storage.get(KEY); return r && r.value ? r.value : null; } catch (e) { return null; }
  },
  async set(v) {
    let remoteOk = false, localOk = false;
    const t = getToken();
    if (t) {
      try {
        const r = await fetch("/api/state", {
          method: "PUT",
          headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
          body: v
        });
        if (r.status === 401) { clearToken(); renderUnlock(); }
        remoteOk = r.ok;
      } catch (e) {}
    }
    try { localStorage.setItem(KEY, v); localOk = true; } catch (e) {}
    if (!remoteOk && !localOk) { try { await window.storage.set(KEY, v); return true; } catch (e) {} }
    return remoteOk || localOk;
  }
};

/* ---- calculs ---- */
const allEx = () => Object.values(PROGRAM).flatMap(d => d.ex);
const exById = id => allEx().find(e => e.id === id);

function week() {
  const d = Math.floor((Date.now() - new Date(CYCLE.start + "T00:00:00")) / 864e5);
  return Math.max(1, Math.floor(d / 7) + 1);
}
function lastSets(id) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i].ex[id];
    if (s && s.length) return s;
  }
  return null;
}
function bestVol(id) {
  let b = 0;
  state.sessions.forEach(s => (s.ex[id] || []).forEach(x => { const v = x.kg * x.reps; if (v > b) b = v; }));
  return b;
}
function avg(arr, days) {
  const cut = Date.now() - days * 864e5;
  const r = arr.filter(x => new Date(x.date) >= cut);
  return r.length ? r.reduce((a, x) => a + x.kg, 0) / r.length : null;
}
function lastOfType(key) {
  for (let i = state.sessions.length - 1; i >= 0; i--) if (state.sessions[i].type === key) return state.sessions[i];
  return null;
}
function daysAgo(dateStr) { return Math.max(0, Math.floor((Date.now() - new Date(dateStr)) / 864e5)); }
function sessionsThisWeek() {
  const cut = Date.now() - 7 * 864e5;
  return state.sessions.filter(s => new Date(s.date) >= cut).length;
}
function sparkline(values) {
  const n = values.length;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = n > 1 ? (i / (n - 1)) * 100 : 50;
    const y = 38 - ((v - min) / range) * 32;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const last = pts[pts.length - 1].split(",");
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none">
    <polyline points="${pts.join(" ")}"></polyline>
    <circle cx="${last[0]}" cy="${last[1]}" r="1.8"></circle>
  </svg>`;
}
function progressChart(values) {
  const n = values.length;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = n > 1 ? (i / (n - 1)) * 100 : 50;
    const y = 38 - ((v - min) / range) * 32;
    return [x, y];
  });
  const line = pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.6"></circle>`).join("");
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none">
    <polyline points="${line}"></polyline>${dots}
  </svg>`;
}
function barChart(items) {
  const max = Math.max(...items.map(i => i.v), 1);
  const n = items.length, gap = 1.2;
  const bw = (100 - gap * (n - 1)) / n;
  const bars = items.map((it, i) => {
    const x = i * (bw + gap);
    const bh = Math.max((it.v / max) * 58, 1);
    const y = 64 - bh;
    return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bw.toFixed(2)}" height="${bh.toFixed(2)}" rx="1.5" fill="${it.color}"></rect>`;
  }).join("");
  return `<svg class="barchart" viewBox="0 0 100 64" preserveAspectRatio="none">${bars}</svg>`;
}
const SPLIT_COLOR = { push: "var(--accent)", pull: "var(--gold)", legs: "var(--violet)" };
function sessionVolumes() {
  return [...state.sessions]
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .map(s => ({ date: s.date, type: s.type, vol: Object.values(s.ex).flat().reduce((a, x) => a + x.kg * x.reps, 0) }));
}
function exerciseSeries(id) {
  return state.sessions
    .filter(s => s.ex[id] && s.ex[id].length)
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .map(s => ({ date: s.date, kg: s.ex[id].reduce((m, x) => x.kg > m ? x.kg : m, 0) }));
}
function weekOf(dateStr) {
  const d = Math.floor((new Date(dateStr) - new Date(CYCLE.start + "T00:00:00")) / 864e5);
  return Math.max(1, Math.floor(d / 7) + 1);
}
function weeklyVolumeByType(type) {
  const map = new Map();
  state.sessions.filter(s => s.type === type).forEach(s => {
    const wk = weekOf(s.date);
    const vol = Object.values(s.ex).flat().reduce((a, x) => a + x.kg * x.reps, 0);
    map.set(wk, (map.get(wk) || 0) + vol);
  });
  return [...map.entries()].sort((a, b) => a[0] - b[0]).map(([wk, vol]) => ({ wk, vol }));
}
function toast(msg) {
  const o = document.querySelector(".toast"); if (o) o.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* ---- boîte de confirmation ---- */
function confirmDialog({ title = "Confirmer", message, confirmLabel = "Confirmer", danger = false }) {
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="sheet" role="alertdialog" aria-modal="true">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <div class="sheet-actions">
        <button class="sheet-btn ghost" data-a="cancel">Annuler</button>
        <button class="sheet-btn ${danger ? "danger" : "primary"}" data-a="ok">${esc(confirmLabel)}</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const close = v => { overlay.remove(); resolve(v); };
    overlay.addEventListener("click", e => {
      if (e.target === overlay) { close(false); return; }
      const b = e.target.closest("button"); if (!b) return;
      close(b.dataset.a === "ok");
    });
  });
}

function viewDay(key) {
  const day = PROGRAM[key];
  let h = "";

  if (week() <= CYCLE.rampWeeks) {
    h += `<div class="phase"><div><b>Phase de reprise — semaines 1 à ${CYCLE.rampWeeks}.</b>
      Charges à 50-60 % de tes anciennes, RIR 3-4, aucune série à l'échec.
      Douleur qui irradie dans la jambe, engourdissement ou perte de force : tu arrêtes la séance et tu consultes.</div></div>`;
  }

  const wv = weeklyVolumeByType(key);
  if (wv.length >= 2) {
    const cur = wv[wv.length - 1], prev = wv[wv.length - 2];
    const diff = cur.vol - prev.vol;
    const pct = prev.vol ? Math.round(diff / prev.vol * 100) : 0;
    h += `<div class="card">
      <div class="ex-sub" style="margin-bottom:9px">Volume ${day.label} par semaine</div>
      ${barChart(wv.slice(-6).map(w => ({ v: w.vol, color: SPLIT_COLOR[key] || "var(--accent)" })))}
      <div class="stat" style="margin-top:11px;margin-bottom:0"><span class="k">Vs semaine dernière</span><span class="v${diff >= 0 ? " hi" : ""}">${diff >= 0 ? "+" : ""}${Math.round(diff).toLocaleString("fr-FR")} kg<small>${diff >= 0 ? "+" : ""}${pct}%</small></span></div>
    </div>`;
  } else if (wv.length === 1) {
    h += `<p class="hint">Encore une seule semaine de ${day.label} enregistrée — la comparaison semaine après semaine apparaîtra ici dès la prochaine.</p>`;
  }

  const lastS = lastOfType(key);
  const targets = (lastS && lastS.review && lastS.review.exercises) || {};
  if (lastS) h += reviewCard(lastS, true);

  day.ex.forEach(ex => {
    const prev = lastSets(ex.id);
    const n = (draft.sets[ex.id] || []).length || ex.s;
    let rows = "";
    for (let i = 0; i < n; i++) {
      const d = (draft.sets[ex.id] || [])[i] || {};
      const p = prev && prev[i];
      rows += `<div class="row">
        <span class="n">${i+1}</span>
        <span class="fld"><input inputmode="decimal" data-ex="${ex.id}" data-i="${i}" data-f="kg"
          value="${d.kg ?? ""}" placeholder="${p ? p.kg : "—"}" aria-label="Charge série ${i+1}"><u>kg</u></span>
        <span class="fld"><input inputmode="numeric" data-ex="${ex.id}" data-i="${i}" data-f="reps"
          value="${d.reps ?? ""}" placeholder="${p ? p.reps : "—"}" aria-label="Répétitions série ${i+1}"><u>reps</u></span>
        <button class="q" data-q="${ex.id}" data-i="${i}" data-v="${d.q ?? ""}" aria-label="Forme technique série ${i+1} : ${d.q == null ? "non notée" : d.q}">${d.q == null ? "·" : Q_SYM[d.q]}</button>
        <button class="prev" data-fillprev="${ex.id}" data-i="${i}" ${p ? "" : "disabled"} aria-label="Reprendre la charge de la dernière fois">${p ? p.kg + "×" + p.reps : "1<sup>re</sup>"}</button>
      </div>`;
    }
    const videoHref = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.n + " technique musculation")}`;
    h += `<section class="ex" data-prio="${ex.prio||0}">
      <div class="ex-head">
        <div class="ex-name">${esc(ex.n)}</div>
        <div class="ex-sub">${ex.s} × ${ex.r}${ex.prio ? " · <em>priorité</em>" : ""}</div>
        ${ex.note ? `<div class="ex-note">${esc(ex.note)}</div>` : ""}
        ${targets[ex.id] ? `<div class="ex-target"><b>Objectif</b>${esc(targets[ex.id].target)}${targets[ex.id].comment ? `<span>${esc(targets[ex.id].comment)}</span>` : ""}</div>` : ""}
        <a class="ex-video" href="${videoHref}" target="_blank" rel="noopener">${ICONS.play}<span>Voir la technique</span></a>
        ${ex.sub && ex.sub.length ? `<div class="sub-row"><span class="sub-label">Si indispo</span>${ex.sub.map(s => `<span class="sub-chip">${esc(s)}</span>`).join("")}</div>` : ""}
      </div>
      <div class="sets">${rows}</div>
      <button class="add" data-add="${ex.id}">+ série</button>
    </section>`;
  });

  if (day.cardio) h += `<section class="ex"><div class="ex-head">
    <div class="ex-name">${esc(day.cardio)}</div><div class="ex-sub">Après la séance</div></div></section>`;

  const lbl = ["Rien à signaler","Gêne légère","Douleur ou irradiation"];
  h += `<div class="check">
    <h3>État du dos</h3>
    <div class="opts">${lbl.map((l,i) =>
      `<button data-back="${i}" aria-pressed="${draft.back===i}" data-v="${i}">${l}</button>`).join("")}</div>
    ${draft.back===2 ? `<p class="warn">Tu arrêtes la séance maintenant. Prends rendez-vous chez le Hausarzt cette semaine pour l'ordonnance de Physiotherapie.</p>` : ""}
    <textarea id="note" placeholder="Note libre : énergie, sommeil, sensations…">${esc(draft.note)}</textarea>
  </div>`;

  h += bar();
  return h;
}

function reviewCard(s, compact) {
  const r = s.review;
  if (!r) {
    const busy = reviewing === s.date;
    return `<div class="card review">
      <div class="k">${compact ? "Dernière séance · " + fmtD(s.date) : "Coach"}</div>
      <p>${compact ? "Pas encore analysée. " : ""}Claude commente la séance et fixe tes objectifs pour la prochaine.</p>
      <button class="ghostbtn" data-review="${s.date}" ${busy || reviewing ? "disabled" : ""}>${busy ? "Analyse en cours…" : "Analyser avec Claude"}</button>
    </div>`;
  }
  const exLines = compact ? "" : Object.entries(r.exercises || {}).map(([id, x]) => {
    const e = exById(id);
    return `<div class="review-ex"><strong>${esc(e ? e.n : id)}</strong> — ${esc(x.comment)}<br><em>→ ${esc(x.target)}</em></div>`;
  }).join("");
  return `<div class="card review">
    <div class="k">Bilan du coach${compact ? " · " + fmtD(s.date) : ""}</div>
    <p>${esc(r.summary)}</p>
    ${exLines}
    ${compact ? "" : `<button class="ghostbtn" data-review="${s.date}" ${reviewing ? "disabled" : ""}>${reviewing === s.date ? "Analyse en cours…" : "Relancer l'analyse"}</button>`}
  </div>`;
}

function bar() {
  const m = String(Math.floor(timer.left/60)).padStart(2,"0");
  const s = String(timer.left%60).padStart(2,"0");
  return `<div class="bar">
    <span class="clock" data-run="${timer.on?1:0}">${m}:${s}</span>
    <button class="pill" data-rest="90">90 s</button>
    <button class="pill" data-rest="180">3 min</button>
    <button class="go" data-save ${dirty()?"":"disabled"}>Enregistrer</button>
  </div>`;
}

function viewJournal() {

    return `<div class="empty">${ICONS.journal}<br>Aucune séance enregistrée.<br>Note tes charges dans Push, Pull ou Legs, puis appuie sur Enregistrer.</div>`;

  return [...state.sessions].reverse().map(s => {
    const vol = Object.values(s.ex).flat().reduce((a,x) => a + x.kg * x.reps, 0);

      const e = exById(id);
      return `<div><strong>${esc(e ? e.n : id)}</strong><br>${sets.map(x => x.kg + "×" + x.reps + qMark(x.q)).join("  ")}</div>`;
    }).join("");

      <div class="date-row">
        <div class="date">${fmtD(s.date)} · ${PROGRAM[s.type] ? PROGRAM[s.type].label : s.type}</div>

function viewSuivi() {
  let h = `<h2 class="sec">Poids à jeun</h2>
    <div class="entry">
      <input id="wIn" inputmode="decimal" placeholder="kg" aria-label="Poids à jeun">
      <button data-addw>Noter</button>
    </div>`;

  const w = state.weights;
  if (w.length) {
    if (w.length >= 2) {
      const recent = w.slice(-20);
      h += `<div class="card">${sparkline(recent.map(x => x.kg))}
        <div class="spark-foot"><span>${recent[0].kg.toFixed(1)} kg</span><span class="hi">${recent[recent.length-1].kg.toFixed(1)} kg</span></div>
      </div>`;
    }
    const cur = w[w.length-1].kg, a7 = avg(w,7), a28 = avg(w,28);
    h += `<div class="stat"><span class="k">Dernier</span><span class="v">${cur.toFixed(1)} kg</span></div>`;
    if (a7)  h += `<div class="stat"><span class="k">Moyenne 7 j</span><span class="v hi">${a7.toFixed(1)} kg</span></div>`;
    if (a28 && a7) {
      const d = a7 - a28;
      h += `<div class="stat"><span class="k">Tendance</span><span class="v">${d>=0?"+":""}${d.toFixed(2)} kg<small>vs 28 j</small></span></div>`;
    }
    h += `<div class="stat"><span class="k">Cible cycle</span><span class="v">${CYCLE.weightGoal.toFixed(1)} kg</span></div>`;
  } else {
    h += `<p class="hint">Chaque matin, à jeun, après être passé aux toilettes, avant de boire. C'est la moyenne sur 7 jours qu'on lit, jamais le chiffre du jour.</p>`;
  }

  h += `<h2 class="sec">Volume d'entraînement</h2>`;
  const vols = sessionVolumes();
  if (vols.length) {
    const recentVols = vols.slice(-15);
    h += `<div class="card">${barChart(recentVols.map(v => ({ v: v.vol, color: SPLIT_COLOR[v.type] || "var(--dim)" })))}
      <div class="chart-legend">
        <span><i style="background:var(--accent)"></i>Push</span>
        <span><i style="background:var(--gold)"></i>Pull</span>
        <span><i style="background:var(--violet)"></i>Legs</span>
      </div>
    </div>`;
    const totalVol = vols.reduce((a, v) => a + v.vol, 0);
    h += `<div class="stat"><span class="k">Volume moyen / séance</span><span class="v">${Math.round(totalVol / vols.length).toLocaleString("fr-FR")} kg</span></div>`;
    h += `<div class="stat"><span class="k">Volume total soulevé</span><span class="v hi">${Math.round(totalVol).toLocaleString("fr-FR")} kg</span></div>`;
  } else {
    h += `<p class="hint">Le volume (charge × répétitions cumulées par séance) apparaîtra ici dès ta première séance enregistrée.</p>`;
  }

  h += `<h2 class="sec">Progression par exercice</h2>`;
  const exWithData = allEx().filter(e => exerciseSeries(e.id).length >= 1);
  if (exWithData.length) {
    if (!analyticsEx || !exWithData.some(e => e.id === analyticsEx)) analyticsEx = exWithData[0].id;
    h += `<select id="exPick" class="ex-pick" aria-label="Choisir un exercice">` +
      exWithData.map(e => `<option value="${e.id}" ${e.id === analyticsEx ? "selected" : ""}>${esc(e.n)}</option>`).join("") +
      `</select>`;
    const series = exerciseSeries(analyticsEx);
    if (series.length >= 2) {
      h += `<div class="card">${progressChart(series.map(s => s.kg))}
        <div class="spark-foot"><span>${series[0].kg} kg</span><span class="hi">${series[series.length-1].kg} kg</span></div>
      </div>`;
      const delta = series[series.length - 1].kg - series[0].kg;
      h += `<div class="stat"><span class="k">Évolution</span><span class="v${delta >= 0 ? " hi" : ""}">${delta >= 0 ? "+" : ""}${delta.toFixed(1)} kg<small>depuis la 1<sup>re</sup> séance</small></span></div>`;
    } else {
      h += `<p class="hint">Une seule séance avec cet exercice pour l'instant — reviens après la prochaine pour voir la tendance.</p>`;
    }
  } else {
    h += `<p class="hint">Enregistre au moins une séance pour voir la progression par exercice ici.</p>`;
  }

  h += `<h2 class="sec">Mesures — le dimanche</h2>`;
  h += `<div class="entry" style="flex-wrap:wrap">` +
    MEASURES.map(m => `<input inputmode="decimal" data-m="${m.id}" placeholder="${m.n}" aria-label="${m.n} en cm" style="flex:1 1 44%">`).join("") +
    `<button data-addm style="flex:1 1 100%;padding:13px 0">Enregistrer les mesures</button></div>`;

  const ms = state.measures;
  if (ms.length) {
    const last = ms[ms.length-1], first = ms[0];
    if (last.epaules && last.taille) {
      const r = last.epaules / last.taille;
      const r0 = first.epaules && first.taille ? first.epaules / first.taille : null;
      h += `<div class="stat"><span class="k">Ratio épaules / taille</span>
        <span class="v hi">${r.toFixed(3)}${r0 && ms.length>1 ? `<small>départ ${r0.toFixed(3)}</small>` : ""}</span></div>`;
    }
    h += MEASURES.map(m => {
      if (last[m.id] == null) return "";
      const d = first[m.id] != null && ms.length > 1 ? last[m.id] - first[m.id] : null;
      return `<div class="stat"><span class="k">${m.n}</span><span class="v">${last[m.id]} cm${
        d !== null ? `<small>${d>=0?"+":""}${d.toFixed(1)}</small>` : ""}</span></div>`;
    }).join("");
  } else {
    h += `<p class="hint">Le ratio épaules / taille est la vraie mesure de ce cycle. Le poids monte partout ; la largeur, non. Mêmes conditions chaque dimanche, à la salle, après le premier repas.</p>`;
  }
  return h;
}

async function loadChat() {
  chat.loaded = true;
  const t = getToken();
  if (!t) return;
  try {
    const r = await fetch("/api/chat", { headers: { Authorization: "Bearer " + t } });
    if (r.status === 401) { clearToken(); renderUnlock(); return; }
    if (r.ok) { const j = await r.json(); chat.messages = j.messages || []; }
  } catch (e) {}
}

async function sendChatMessage() {
  const input = $("#chatIn");
  const text = (input.value || "").trim();
  if (!text || chat.loading) return;
  input.value = "";
  chat.messages.push({ role: "user", content: text, date: new Date().toISOString() });
  chat.loading = true;
  render();
  const t = getToken();
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    if (r.status === 401) { clearToken(); chat.loading = false; renderUnlock(); return; }
    const j = await r.json();
    if (r.ok) {
      chat.messages.push({ role: "assistant", content: j.reply, date: new Date().toISOString() });
    } else {
      toast("Le coach n'a pas pu répondre");
    }
  } catch (e) {
    toast("Connexion au coach impossible");
  }
  chat.loading = false;
  render();
}

function resizeImageFile(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve({ dataUrl, base64: dataUrl.split(",")[1] });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const t = getToken();

  try {
    const r = await fetch("/api/meals", { headers: { Authorization: "Bearer " + t } });
    if (r.status === 401) { clearToken(); renderUnlock(); return; }
    if (r.ok) { const j = await r.json(); meals.items = j.meals || []; }
  } catch (e) {}
}

async function analyzeMealPhoto() {
  if (!meals.pending || meals.uploading) return;
  meals.uploading = true;
  render();
  const noteEl = $("#mealNote");
  const note = (noteEl && noteEl.value || "").trim();
  const t = getToken();
  try {
    const r = await fetch("/api/meals", {
      method: "POST",
      headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
      body: JSON.stringify({ image: meals.pending, note })
    });
    if (r.status === 401) { clearToken(); meals.uploading = false; renderUnlock(); return; }
    const j = await r.json();
    if (r.ok) {
      meals.items.unshift({
        id: j.id, image: meals.pending, note, items: j.items, calories: j.calories,
        protein_g: j.protein_g, carbs_g: j.carbs_g, fat_g: j.fat_g,
        confidence: j.confidence, analysisNote: j.note, date: new Date().toISOString()
      });
      toast("Repas analysé");
    } else {
      toast("Analyse impossible");
    }
  } catch (e) {
    toast("Connexion impossible");
  }
  meals.pending = null; meals.pendingPreview = null; meals.uploading = false;
  render();
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;

  if ("unlock" in b.dataset) {
    const v = ($("#tokenIn").value || "").trim();
    if (!v) return;
    setToken(v);
    await boot();
    return;
  }

  if (b.dataset.tab) {
    tab = b.dataset.tab;
    if (tab === "coach" && !chat.loaded) await loadChat();
    if (tab === "meals" && !meals.loaded) await loadMeals();
    render(); window.scrollTo(0,0); return;
  }
  if ("sendChat" in b.dataset) { await sendChatMessage(); return; }
  if ("takePhoto" in b.dataset) { $("#mealFile").click(); return; }
  if ("cancelMeal" in b.dataset) { meals.pending = null; meals.pendingPreview = null; render(); return; }
  if ("analyzeMeal" in b.dataset) { await analyzeMealPhoto(); return; }
  if (b.dataset.delmeal) {
    const id = b.dataset.delmeal;
    const ok = await confirmDialog({ title: "Supprimer ce repas ?", message: "L'entrée et son estimation seront définitivement supprimées.", confirmLabel: "Supprimer", danger: true });
    if (!ok) return;
    const t = getToken();
    try {
      const r = await fetch("/api/meals/" + id, { method: "DELETE", headers: { Authorization: "Bearer " + t } });
      if (r.status === 401) { clearToken(); renderUnlock(); return; }
    } catch (e) {}
    meals.items = meals.items.filter(m => String(m.id) !== String(id));
    render(); return;
  }
  if (b.dataset.rest) { startTimer(+b.dataset.rest); return; }
  if (b.dataset.back !== undefined) { draft.back = +b.dataset.back; render(); return; }

  if (b.dataset.add !== undefined) {
    const id = b.dataset.add, ex = exById(id);
    const cur = draft.sets[id] || [];
    const n = cur.length || ex.s;
    draft.sets[id] = Array.from({length:n+1}, (_,i) => cur[i] || {});
    render(); return;
  }

  if (b.dataset.q) {
    const id = b.dataset.q, idx = +b.dataset.i, ex = exById(id);
    const cur = draft.sets[id] || [];
    const next = Array.from({length: cur.length || ex.s}, (_, i) => cur[i] || {});
    const q = Q_NEXT[String(next[idx].q ?? "")];
    const row = { ...next[idx] };
    if (q == null) delete row.q; else row.q = q;
    next[idx] = row;
    draft.sets[id] = next;
    b.dataset.v = q ?? "";
    b.textContent = q == null ? "·" : Q_SYM[q];
    b.setAttribute("aria-label", `Forme technique série ${idx+1} : ${q == null ? "non notée" : q}`);
    return;
  }

  if (b.dataset.review) { await reviewLastSession(b.dataset.review); return; }

  if (b.dataset.fillprev) {
    const id = b.dataset.fillprev, idx = +b.dataset.i;
    const prev = lastSets(id);
    const p = prev && prev[idx];
    if (!p) return;
    const ex = exById(id);
    const cur = draft.sets[id] || [];
    const n = cur.length || ex.s;
    const next = Array.from({length: n}, (_, i) => cur[i] || {});
    next[idx] = { ...next[idx], kg: p.kg, reps: p.reps };
    draft.sets[id] = next;
    render(); return;
  }

  if ("save" in b.dataset) { await saveSession(); return; }

  if ("addw" in b.dataset) {
    const v = num($("#wIn").value);
    if (v === null || v < 30 || v > 200) { toast("Entre un poids valide"); return; }
    state.weights.push({ date: new Date().toISOString(), kg: v });
    await persist(); toast("Poids noté"); render(); return;
  }

  if ("addm" in b.dataset) {
    const rec = { date: new Date().toISOString() };
    let any = false;
    document.querySelectorAll("[data-m]").forEach(i => {
      const v = num(i.value);
      if (v !== null && v > 10 && v < 200) { rec[i.dataset.m] = v; any = true; }
    });
    if (!any) { toast("Aucune mesure saisie"); return; }
    state.measures.push(rec);
    await persist(); toast("Mesures enregistrées"); render(); return;
  }

  if ("export" in b.dataset) {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "carnet-" + new Date().toISOString().slice(0,10) + ".json";
    a.click(); URL.revokeObjectURL(a.href);
    toast("Fichier exporté"); return;
  }

  if ("import" in b.dataset) { $("#fileIn").click(); return; }

  if (b.dataset.del) {
    const dateStr = b.dataset.del;
    const ok = await confirmDialog({
      title: "Supprimer la séance ?",
      message: `La séance du ${fmtD(dateStr)} sera définitivement supprimée.`,
      confirmLabel: "Supprimer",
      danger: true
    });
    if (!ok) return;
    state.sessions = state.sessions.filter(s => s.date !== dateStr);
    await persist(); toast("Séance supprimée"); render(); return;
  }

  if ("clearall" in b.dataset) {
    const ok = await confirmDialog({
      title: "Effacer toutes les données ?",
      message: "Séances, poids et mesures seront définitivement supprimés de cet appareil. Exporte une sauvegarde d'abord si tu n'es pas sûr.",
      confirmLabel: "Tout effacer",
      danger: true
    });
    if (!ok) return;
    state = { sessions: [], weights: [], measures: [] };
    await persist(); toast("Données effacées"); render(); return;
  }
});

document.addEventListener("change", async e => {
  if (e.target.id === "exPick") { analyticsEx = e.target.value; render(); return; }
  if (e.target.id === "mealFile") {
    if (!e.target.files.length) return;
    try {
      const { dataUrl, base64 } = await resizeImageFile(e.target.files[0]);
      meals.pending = base64;
      meals.pendingPreview = dataUrl;
      render();
    } catch (err) { toast("Image illisible"); }
    e.target.value = "";
    return;
  }
  if (e.target.id !== "fileIn" || !e.target.files.length) return;
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d.sessions) throw 0;
    const hasData = state.sessions.length || state.weights.length || state.measures.length;
    if (hasData) {
      const ok = await confirmDialog({
        title: "Remplacer les données actuelles ?",
        message: `L'import écrasera tes ${state.sessions.length} séance${state.sessions.length>1?"s":""} actuelles avec le contenu du fichier.`,
        confirmLabel: "Importer",
        danger: true
      });
      if (!ok) { e.target.value = ""; return; }
    }
    state = { sessions: d.sessions||[], weights: d.weights||[], measures: d.measures||[] };
    await persist(); toast("Données importées"); render();
  } catch (err) { toast("Fichier illisible"); }
  e.target.value = "";
});

document.addEventListener("input", e => {
  if (e.target.id === "note") { draft.note = e.target.value; return; }
  const i = e.target.closest("input[data-ex]"); if (!i) return;
  const { ex, i: idx, f } = i.dataset;
  draft.sets[ex] = draft.sets[ex] || [];
  draft.sets[ex][idx] = draft.sets[ex][idx] || {};
  draft.sets[ex][idx][f] = i.value;
  const go = document.querySelector("[data-save]"); if (go) go.disabled = false;
});

function startTimer(sec) {
  clearInterval(timer.iv);
  timer.left = sec; timer.on = true;
  const paint = () => {
    const c = document.querySelector(".clock"); if (!c) return;
    c.textContent = String(Math.floor(timer.left/60)).padStart(2,"0") + ":" + String(timer.left%60).padStart(2,"0");
    c.dataset.run = timer.on ? 1 : 0;
  };
  paint();
  timer.iv = setInterval(() => {
    timer.left--;
    if (timer.left <= 0) { clearInterval(timer.iv); timer.on = false; timer.left = 0; toast("Série suivante"); }
    paint();
  }, 1000);
}

async function saveSession() {
  const ex = {}; let pr = 0;
  Object.entries(draft.sets).forEach(([id, sets]) => {
    const clean = sets.filter(s => s && (s.kg || s.reps))
                      .map(s => s.q != null ? { kg: num(s.kg) || 0, reps: num(s.reps) || 0, q: s.q }
                                            : { kg: num(s.kg) || 0, reps: num(s.reps) || 0 });
    if (!clean.length) return;
    const best = bestVol(id);
    if (best > 0) clean.forEach(s => { if (s.kg * s.reps > best) pr++; });
    ex[id] = clean;
  });
  if (!Object.keys(ex).length) { toast("Rien à enregistrer"); return; }

  state.sessions.push({
    date: new Date().toISOString(), type: tab, ex,
    back: draft.back, note: draft.note.trim()
  });
  await persist();
  draft = { sets: {}, back: 0, note: "" };
  toast(pr ? `Enregistré · ${pr} record${pr>1?"s":""}` : "Séance enregistrée");
  render();
}

async function reviewLastSession(dateStr) {
  const s = state.sessions.find(x => x.date === dateStr);
  if (!s || !PROGRAM[s.type] || reviewing) return;
  const history = state.sessions.filter(x => x.type === s.type && x.date < s.date).slice(-3)
    .map(({ date, ex, back, note }) => ({ date, ex, back, note }));
  reviewing = s.date;
  render();
  try {
    const r = await fetch("/api/review", {
      method: "POST",
      headers: { Authorization: "Bearer " + getToken(), "Content-Type": "application/json" },
      body: JSON.stringify({
        session: { date: s.date, ex: s.ex, back: s.back, note: s.note },
        history, program: PROGRAM[s.type], week: week(), rampWeeks: CYCLE.rampWeeks
      })
    });
    if (r.status === 401) { clearToken(); reviewing = null; renderUnlock(); return; }
    const j = await r.json();
    if (r.ok) {
      s.review = { summary: j.summary, exercises: j.exercises, date: new Date().toISOString() };
      await persist();
      toast("Bilan prêt");
    } else {
      toast("Analyse impossible");
    }
  } catch (e) {
    toast("Connexion impossible");
  }
  reviewing = null;
  render();
}

window.addEventListener("beforeunload", e => { if (dirty()) e.preventDefault(); });

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "tokenIn") $("[data-unlock]")?.click();
  if (e.key === "Enter" && e.target.id === "chatIn") $("[data-send-chat]")?.click();
});

if (getToken()) boot(); else renderUnlock();
</script>
</body>
</html>
